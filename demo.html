<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tolu Tamagotchi | Demo</title><link rel="stylesheet" href="companion.css"><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f0ea;color:#302b35;padding:32px 24px;margin:0}main{max-width:520px;margin:auto;padding-bottom:240px}h1{font-size:30px;line-height:1.2}fieldset{border:1px solid #d6cfc6;border-radius:12px;margin:16px 0;padding:16px}label{display:block;margin:10px 0}button,select{font:inherit;padding:7px 12px;border:1px solid #bdb3ae;background:white;border-radius:7px;color:#302b35}input{width:100%;accent-color:#8e6fbd}code{font-size:13px}pre{white-space:pre-wrap;background:#e7e0d9;padding:14px;border-radius:8px}</style><main><h1>Tolu Tamagotchi</h1><p>A tiny programmable daily-page companion. Try changing its mood and stats, or click the avatar to celebrate.</p><fieldset><legend>Companion controls</legend><label>Mood <select id="mood"></select></label><label>Energy <output id="energyValue">80</output><input id="energy" type="range" min="0" max="100" value="80"></label><label>Focus <output id="focusValue">92</output><input id="focus" type="range" min="0" max="100" value="92"></label><button id="celebrate">Celebrate!</button> <button id="recharge">Coffee break</button></fieldset><pre id="code"></pre></main><script src="companion.js"></script><script>
const companion=ToluCompanion.mount(window.demoOptions || {}); window.companion=companion;
const mood=document.querySelector('#mood');const energy=document.querySelector('#energy');const focus=document.querySelector('#focus');ToluCompanion.states.forEach(s=>mood.add(new Option(s,s)));
function update(){const s=companion.setState({mood:mood.value,energy:+energy.value,focus:+focus.value});document.querySelector('#energyValue').value=s.energy;document.querySelector('#focusValue').value=s.focus;document.querySelector('#code').textContent='companion.setState('+JSON.stringify(s,null,2)+')';}mood.onchange=update;energy.oninput=update;focus.oninput=update;document.querySelector('#celebrate').onclick=()=>companion.celebrate();document.querySelector('#recharge').onclick=()=>companion.recharge();update();</script></html>
