<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tolu Tamagotchi | Demo</title><style>.tolu-companion{--sprite-size:144px;--sheet-width:864px;position:fixed;bottom:20px;right:20px;z-index:1000;display:grid;justify-items:center;gap:2px;width:220px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;pointer-events:none;color:#fff;box-sizing:border-box}
.tolu-companion *{box-sizing:border-box}.tolu-companion__sprite{width:var(--sprite-size);height:var(--sprite-size);background-repeat:no-repeat;background-size:var(--sheet-width) var(--sprite-size);image-rendering:pixelated;animation:tolu-frames var(--duration,1.8s) steps(6,end) infinite;pointer-events:auto;border:0;padding:0;cursor:pointer;background-color:transparent;appearance:none;filter:drop-shadow(0 4px 3px #0002)}
@keyframes tolu-frames{from{background-position:0 0}to{background-position:calc(-1 * var(--sheet-width)) 0}}
.tolu-companion__panel{width:100%;background:#302b35;color:#fff;padding:10px 12px;border:1px solid #49414f;border-radius:9px;box-shadow:0 4px 14px #0002;pointer-events:auto;display:grid;gap:6px}
.tolu-companion__heading{display:flex;justify-content:space-between;align-items:center;gap:6px}.tolu-companion__name{font-weight:700;font-size:14px}.tolu-companion__mood{font-size:10px;color:#d9c9f5;text-transform:uppercase}.tolu-companion__stat{display:grid;grid-template-columns:48px 1fr 28px;align-items:center;gap:6px}.tolu-companion__track{height:7px;border-radius:3px;background:#554d60;overflow:hidden}.tolu-companion__fill{display:block;height:100%;background:#bba5f5;transition:width .25s}.tolu-companion__fill--energy{background:#a8d49c}.tolu-companion__value{text-align:right;font-variant-numeric:tabular-nums}
.tolu-companion__sprite:focus-visible{outline:2px solid #a78bfa;outline-offset:2px;border-radius:8px}

</style><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f0ea;color:#302b35;padding:32px 24px;margin:0}main{max-width:520px;margin:auto;padding-bottom:240px}h1{font-size:30px;line-height:1.2}fieldset{border:1px solid #d6cfc6;border-radius:12px;margin:16px 0;padding:16px}label{display:block;margin:10px 0}button,select{font:inherit;padding:7px 12px;border:1px solid #bdb3ae;background:white;border-radius:7px;color:#302b35}input{width:100%;accent-color:#8e6fbd}code{font-size:13px}pre{white-space:pre-wrap;background:#e7e0d9;padding:14px;border-radius:8px}</style><main><h1>Tolu Tamagotchi</h1><p>A tiny programmable daily-page companion. Try changing its mood and stats, or click the avatar to celebrate.</p><fieldset><legend>Companion controls</legend><label>Mood <select id="mood"></select></label><label>Energy <output id="energyValue">80</output><input id="energy" type="range" min="0" max="100" value="80"></label><label>Focus <output id="focusValue">92</output><input id="focus" type="range" min="0" max="100" value="92"></label><button id="celebrate">Celebrate!</button> <button id="recharge">Coffee break</button></fieldset><pre id="code"></pre></main><script>(function (global) {
  'use strict';
  const states = Object.freeze({idle: 2.4, coding: 0.8, thinking: 1.8, celebrating: 0.85, recharging: 1.8, sleeping: 2.4});
  const scriptBase = document.currentScript?.src || document.baseURI;
  const clamp = v => { const n = Number(v); if (!Number.isFinite(n)) throw new TypeError('Stat must be a finite number'); return Math.round(Math.max(0, Math.min(100, n))); };
  function mount(options = {}) {
    const target = options.target || document.body;
    const assetBase = options.assetBase || new URL('./sprites/', scriptBase).href;
    const base = new URL(assetBase.endsWith('/') ? assetBase : assetBase + '/', document.baseURI);
    const assets = Object.fromEntries(Object.keys(states).map(mood => [mood, options.sprites?.[mood] || new URL(mood + '.png', base).href]));
    const name = options.name ?? 'Tolu';
    const root = document.createElement('aside'); root.className = 'tolu-companion'; root.setAttribute('aria-label', name + ' companion');
    root.innerHTML = `<button type="button" class="tolu-companion__sprite"></button><div class="tolu-companion__panel"><div class="tolu-companion__heading"><span class="tolu-companion__name"></span><span class="tolu-companion__mood" aria-live="polite"></span></div>${['energy','focus'].map(stat => `<div class="tolu-companion__stat"><span>${stat[0].toUpperCase()+stat.slice(1)}</span><div class="tolu-companion__track" role="progressbar" aria-label="${stat}" aria-valuemin="0" aria-valuemax="100"><span class="tolu-companion__fill tolu-companion__fill--${stat}"></span></div><span class="tolu-companion__value"></span></div>`).join('')}</div>`;
    const sprite = root.querySelector('button'); const moodLabel = root.querySelector('.tolu-companion__mood');
    root.querySelector('.tolu-companion__name').textContent = name;
    const rows = [...root.querySelectorAll('.tolu-companion__stat')];
    let state = {mood:'idle',energy:80,focus:92}; let displayed = null; let timer; let transient = null;
    const preload = Object.values(assets).map(url => { const image = new Image(); image.src = url; return image; });
    function render() {
      const mood = transient || state.mood;
      if (displayed !== mood) {
        sprite.style.backgroundImage = `url(${JSON.stringify(assets[mood])})`;
        sprite.style.setProperty('--duration', states[mood]+'s');
        sprite.style.animationName = 'none'; void sprite.offsetWidth; sprite.style.removeProperty('animation-name');
        moodLabel.textContent = mood; sprite.setAttribute('aria-label', name + ' is ' + mood + '. Click to celebrate.'); displayed=mood;
      }
      ['energy','focus'].forEach((key,i) => { const value=state[key]; rows[i].querySelector('.tolu-companion__fill').style.width=value+'%'; rows[i].querySelector('.tolu-companion__track').setAttribute('aria-valuenow',value); rows[i].querySelector('.tolu-companion__value').textContent=value; });
    }
    function validate(mood) { if (!Object.hasOwn(states,mood)) throw new RangeError('Unknown mood: '+mood); }
    function setState(patch = {}) {
      const next = {...state};
      if (patch.mood !== undefined) {validate(patch.mood); next.mood=patch.mood;}
      for (const key of ['energy','focus']) if (patch[key] !== undefined) next[key]=clamp(patch[key]);
      if (patch.mood !== undefined) {clearTimeout(timer); transient=null;}
      state=next; render(); return {...state};
    }
    function play(mood, duration=2200) {validate(mood); if (!Number.isFinite(duration) || duration<0) throw new RangeError('Invalid duration'); clearTimeout(timer); transient=mood; render(); timer=setTimeout(()=>{transient=null; render();},duration);}
    sprite.addEventListener('click',()=>play('celebrating'));
    setState(options.initialState); target.append(root);
    return {setState, getState:()=>({...state}), play, celebrate:(ms)=>play('celebrating',ms), sleep:()=>setState({mood:'sleeping'}), recharge:(ms)=>play('recharging',ms), destroy:()=>{clearTimeout(timer);root.remove();preload.length=0;}};
  }
  global.ToluCompanion = Object.freeze({mount, states:Object.freeze(Object.keys(states))});
})(window);

const companion=ToluCompanion.mount(window.demoOptions || {}); window.companion=companion;
const mood=document.querySelector('#mood');const energy=document.querySelector('#energy');const focus=document.querySelector('#focus');ToluCompanion.states.forEach(s=>mood.add(new Option(s,s)));
function update(){const s=companion.setState({mood:mood.value,energy:+energy.value,focus:+focus.value});document.querySelector('#energyValue').value=s.energy;document.querySelector('#focusValue').value=s.focus;document.querySelector('#code').textContent='companion.setState('+JSON.stringify(s,null,2)+')';}mood.onchange=update;energy.oninput=update;focus.oninput=update;document.querySelector('#celebrate').onclick=()=>companion.celebrate();document.querySelector('#recharge').onclick=()=>companion.recharge();update();</script></html>
